<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cronograma Culto Expansão</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#4b5bd6" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Culto Expansão" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root {
    --bg: #f6f7fb;
    --panel: #ffffff;
    --ink: #15192b;
    --muted: #5c6378;
    --line: #e5e8f0;
    --accent: #4b5bd6;
    --accent-ink: #ffffff;
    --danger: #c0362c;
    --ok: #1f8a4c;
    --chip: #eef0fb;
    --row-alt: #fafbff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1220;
      --panel: #171a2b;
      --ink: #eef0fa;
      --muted: #9aa1b8;
      --line: #272b40;
      --accent: #8792ff;
      --accent-ink: #0f1220;
      --danger: #ff8378;
      --ok: #67d49a;
      --chip: #222642;
      --row-alt: #1b1f33;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1220; --panel: #171a2b; --ink: #eef0fa; --muted: #9aa1b8;
    --line: #272b40; --accent: #8792ff; --accent-ink: #0f1220;
    --danger: #ff8378; --ok: #67d49a; --chip: #222642; --row-alt: #1b1f33;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45; min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  header h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 14px; }
  .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .actions .user { font-size: 13px; color: var(--muted); margin-right: 4px; }
  button, .btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); padding: 8px 12px; border-radius: 8px;
    font-size: 14px; cursor: pointer; font-family: inherit;
  }
  button:hover, .btn:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent); color: var(--accent-ink);
    border-color: var(--accent); font-weight: 600;
  }
  button.danger { color: var(--danger); border-color: var(--line); background: transparent; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 15px; margin: 0 0 12px; letter-spacing: 0.02em;
    text-transform: uppercase; color: var(--muted);
  }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); }
  input, select, textarea {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 36px; }
  .col-2 { grid-column: span 2; } .col-3 { grid-column: span 3; }
  .col-4 { grid-column: span 4; } .col-6 { grid-column: span 6; }
  .col-12 { grid-column: span 12; }
  @media (max-width: 720px) {
    .col-2, .col-3, .col-4, .col-6 { grid-column: span 12; }
  }
  .form-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 10px; }
  .filters .field { flex: 1 1 160px; }
  .chip {
    display: inline-block; background: var(--chip); color: var(--ink);
    padding: 2px 8px; border-radius: 999px; font-size: 12px;
  }
  .culto-group {
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    margin-bottom: 14px; background: var(--panel);
  }
  .culto-head {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    background: var(--row-alt); border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .culto-head .date { font-weight: 700; font-size: 15px; }
  .culto-head .meta { color: var(--muted); font-size: 13px; }
  .culto-head .right { margin-left: auto; display: flex; gap: 6px; }
  table.items { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.items th, table.items td {
    text-align: left; padding: 10px 12px;
    border-bottom: 1px solid var(--line); vertical-align: top;
  }
  table.items th {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--muted); font-weight: 600; background: transparent;
  }
  table.items tr:last-child td { border-bottom: none; }
  table.items .time { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); width: 70px; }
  table.items .act-col { width: 1%; white-space: nowrap; }
  table.items .act-col button { padding: 4px 8px; font-size: 12px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); font-size: 14px; }
  details.add-item {
    padding: 10px 14px; border-top: 1px solid var(--line); background: var(--row-alt);
  }
  details.add-item summary {
    cursor: pointer; font-size: 13px; color: var(--accent); user-select: none;
  }
  details.add-item[open] summary { margin-bottom: 10px; }
  .inline-form .grid { gap: 8px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 16px;
    border-radius: 999px; font-size: 13px; opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 10;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; }
  .theme-toggle { font-size: 13px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* Live banner */
  .live {
    position: sticky; top: 0; z-index: 20;
    margin: -24px -16px 16px; padding: 14px 16px calc(14px + env(safe-area-inset-top));
    background: linear-gradient(135deg, #4b5bd6, #3a46b8);
    color: #fff;
    border-radius: 0 0 14px 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  }
  .live.hidden-live { display: none; }
  .live .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .live .label {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    opacity: 0.75; font-weight: 700;
  }
  .live .title { font-size: 18px; font-weight: 700; line-height: 1.2; }
  .live .meta { font-size: 13px; opacity: 0.9; }
  .live .resp { margin-top: 6px; font-size: 14px; }
  .live .resp div { opacity: 0.95; }
  .live .divider { height: 1px; background: rgba(255,255,255,0.2); margin: 10px 0; }
  .live .next .title { font-size: 15px; }
  .live .highlight {
    display: inline-block; background: #ffd84a; color: #1a1a1a;
    padding: 4px 10px; border-radius: 999px; font-weight: 700;
    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    margin-top: 6px;
  }
  .live .corner {
    position: absolute; top: 10px; right: 10px; opacity: 0.6; font-size: 11px;
  }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 50;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px; width: 100%; max-width: 520px;
    max-height: 90vh; overflow: auto;
  }
  .modal h3 { margin: 0 0 12px; font-size: 16px; }
  .modal .form-footer { margin-top: 14px; }

  /* Login screen */
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 24px; width: 100%; max-width: 380px;
  }
  .login-card h1 { margin: 0 0 6px; font-size: 20px; }
  .login-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .login-card .field { margin-bottom: 10px; }
  .login-card .err {
    color: var(--danger); font-size: 13px; margin: 8px 0 0;
  }
  .login-card .sw {
    margin-top: 14px; font-size: 13px; color: var(--muted); text-align: center;
  }
  .login-card .sw a { color: var(--accent); cursor: pointer; }
  .status-dot {
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background: var(--muted); margin-right:6px; vertical-align:middle;
  }
  .status-dot.online { background: var(--ok); }
  .status-dot.offline { background: var(--danger); }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginView" class="login-wrap" hidden>
  <div class="login-card">
    <h1>Culto Expansão</h1>
    <div class="sub">Entre para ver e editar o cronograma.</div>
    <form id="loginForm">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" required minlength="6" />
      </div>
      <div class="form-footer" style="justify-content: space-between; align-items: center;">
        <small class="hint" id="modeHint">Já tem conta? Faça login.</small>
        <button type="submit" class="primary" id="loginSubmit">Entrar</button>
      </div>
      <p class="err" id="loginErr" hidden></p>
      <div class="sw">
        <span id="swText">Novo por aqui?</span>
        <a id="swLink">Criar conta</a>
      </div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="appView" class="wrap" hidden>
  <div id="liveBanner" class="live hidden-live"></div>
  <header>
    <div>
      <h1>Cronograma — Culto Expansão</h1>
      <div class="sub">
        <span id="statusDot" class="status-dot" title="status"></span>
        <span id="statusText">conectando…</span>
      </div>
    </div>
    <div class="actions">
      <span class="user" id="userLabel"></span>
      <button id="nomeBtn" title="Meu nome no cronograma">Meu nome</button>
      <button id="notifBtn" title="Notificações" hidden>Ativar avisos</button>
      <button id="bubbleBtn" title="Bolha flutuante" hidden>Bolha</button>
      <button id="diagBtn" title="Diagnóstico" hidden>Diag</button>
      <button id="themeBtn" class="theme-toggle" title="Alternar tema">Tema</button>
      <button id="logoutBtn">Sair</button>
    </div>
  </header>

  <section class="panel">
    <h2>Novo culto</h2>
    <form id="cultoForm">
      <div class="grid">
        <div class="field col-3">
          <label for="data">Data</label>
          <input type="date" id="data" required />
        </div>
        <div class="field col-2">
          <label for="hora">Horário</label>
          <input type="time" id="hora" value="19:30" />
        </div>
        <div class="field col-3">
          <label for="tema">Tema / Título</label>
          <input type="text" id="tema" placeholder="Ex: Avivamento" />
        </div>
        <div class="field col-2">
          <label for="pregador">Pregador(a)</label>
          <input type="text" id="pregador" placeholder="Nome" />
        </div>
        <div class="field col-2">
          <label for="dirigente">Dirigente</label>
          <input type="text" id="dirigente" placeholder="Nome" />
        </div>
        <div class="field col-12">
          <label for="obs">Observações</label>
          <textarea id="obs" rows="2" placeholder="Informações gerais do culto"></textarea>
        </div>
      </div>
      <div class="form-footer">
        <button type="reset">Limpar</button>
        <button type="submit" class="primary" id="addCultoBtn">Adicionar culto</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="filters">
      <div class="field">
        <label for="filtroBusca">Buscar</label>
        <input type="search" id="filtroBusca" placeholder="Tema, pregador, responsável..." />
      </div>
      <div class="field">
        <label for="filtroMes">Mês</label>
        <input type="month" id="filtroMes" />
      </div>
      <div class="field" style="flex: 0 0 auto;">
        <label>&nbsp;</label>
        <button id="limparFiltros" type="button">Limpar filtros</button>
      </div>
    </div>
    <div id="lista"></div>
  </section>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.58.0";

const SUPABASE_URL = "https://hlanykgmgobvmkdbrhah.supabase.co";
const SUPABASE_KEY = "sb_publishable_UryQ3e7SexzuANnyAgr8Lw_p-LMyaoy";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
});

const THEME_KEY = "cronograma-expansao-theme";
const NAME_KEY  = "cronograma-expansao-nome";
let meuNome = (localStorage.getItem(NAME_KEY) || "").trim();

// --- PWA: service worker ---
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

// --- Ponte para o app nativo Android (apenas quando aberto dentro do app) ---
const Native = (typeof window.CultoNative !== "undefined") ? window.CultoNative : null;
if (Native) document.documentElement.classList.add("in-native-app");

const DEFAULT_MOMENTOS = [
  { hora: "18:30", hora_fim: "19:00", atividade: "Intercessão", responsavel: "" },
  { hora: "19:00", hora_fim: "19:20", atividade: "Momento Adore", responsavel: "" },
  { hora: "19:20", hora_fim: "19:25", atividade: "Palavra introdutória", responsavel: "" },
  { hora: "19:25", hora_fim: "19:50", atividade: "Participação Individual", responsavel: "" },
  { hora: "19:50", hora_fim: "19:55", atividade: "Boas-vindas e Ofertório", responsavel: "" },
  { hora: "19:55", hora_fim: "20:00", atividade: "Expansão: Rei e Santo", responsavel: "" },
  { hora: "20:00", hora_fim: "20:05", atividade: "Momento Fire", responsavel: "" },
  { hora: "20:05", hora_fim: "21:10", atividade: "Momento da Palavra e Apelo", responsavel: "" },
  { hora: "21:10", hora_fim: "21:15", atividade: "Considerações Finais", responsavel: "" },
  { hora: "21:15", hora_fim: "",      atividade: "Último louvor", responsavel: "" },
];

let cultos = [];       // array de { ...culto, momentos: [] }
let authMode = "login"; // or "signup"
let realtimeChannel = null;

// ---------- helpers ----------
function el(id) { return document.getElementById(id); }
function toast(msg) {
  const t = el("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}
function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmtDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const dias = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
  const meses = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  return dias[dt.getDay()] + ", " + d + " de " + meses[dt.getMonth()] + " de " + y;
}
function setStatus(state, text) {
  const dot = el("statusDot");
  dot.classList.remove("online", "offline");
  if (state === "online") dot.classList.add("online");
  else if (state === "offline") dot.classList.add("offline");
  el("statusText").textContent = text;
}

// ---------- theme ----------
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
try { const saved = localStorage.getItem(THEME_KEY); if (saved) applyTheme(saved); } catch (e) {}
el("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
  const next = !cur ? (prefersDark ? "light" : "dark") : (cur === "dark" ? "light" : "dark");
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
});

// ---------- auth UI ----------
function updateAuthMode() {
  const isLogin = authMode === "login";
  el("modeHint").textContent = isLogin ? "Já tem conta? Faça login." : "Crie sua conta para acessar.";
  el("loginSubmit").textContent = isLogin ? "Entrar" : "Criar conta";
  el("swText").textContent = isLogin ? "Novo por aqui?" : "Já tem conta?";
  el("swLink").textContent = isLogin ? "Criar conta" : "Entrar";
  el("loginErr").hidden = true;
}
el("swLink").addEventListener("click", () => {
  authMode = authMode === "login" ? "signup" : "login";
  updateAuthMode();
});
el("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  el("loginErr").hidden = true;
  el("loginSubmit").disabled = true;
  const email = el("email").value.trim();
  const senha = el("senha").value;
  try {
    if (authMode === "login") {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password: senha });
      if (error) throw error;
      const u = data?.session?.user || data?.user;
      if (u) { await showApp(u); return; }
      setTimeout(() => location.reload(), 300);
    } else {
      const { data, error } = await supabase.auth.signUp({ email, password: senha });
      if (error) throw error;
      const u = data?.session?.user || data?.user;
      if (u && data?.session) { await showApp(u); return; }
      if (u && !data?.session) {
        toast("Conta criada. Verifique seu e-mail para confirmar o acesso.");
        authMode = "login"; updateAuthMode();
      } else {
        location.reload();
      }
    }
  } catch (err) {
    el("loginErr").textContent = traduzErro(err?.message || String(err));
    el("loginErr").style.color = "var(--danger)";
    el("loginErr").hidden = false;
  } finally {
    el("loginSubmit").disabled = false;
  }
});
el("logoutBtn").addEventListener("click", async () => {
  await supabase.auth.signOut();
});

function traduzErro(msg) {
  const m = msg.toLowerCase();
  if (m.includes("invalid login")) return "E-mail ou senha incorretos.";
  if (m.includes("already registered")) return "Este e-mail já tem conta.";
  if (m.includes("password should be")) return "A senha precisa ter pelo menos 6 caracteres.";
  if (m.includes("email not confirmed")) return "Confirme seu e-mail antes de entrar.";
  return msg;
}

// ---------- auth lifecycle ----------
supabase.auth.onAuthStateChange((_event, session) => {
  if (session?.user) showApp(session.user); else showLogin();
});
(async () => {
  const { data } = await supabase.auth.getSession();
  if (data.session?.user) showApp(data.session.user); else showLogin();
})();

function showLogin() {
  const app = el("appView"), login = el("loginView");
  app.hidden = true; app.style.display = "none";
  login.hidden = false; login.style.display = "";
  updateAuthMode();
  teardownRealtime();
  cultos = [];
}
async function showApp(user) {
  const app = el("appView"), login = el("loginView");
  login.hidden = true; login.style.display = "none";
  app.hidden = false; app.style.display = "";
  el("userLabel").textContent = user.email || "";
  updateNotifButton();
  updateBubbleButton();
  initDefaultDate();
  await loadAll();
  setupRealtime();
  startLiveTick();
  if (!meuNome) setTimeout(abrirMeuNome, 400);
}

// ---------- data load ----------
async function loadAll() {
  setStatus("", "carregando…");
  const { data: cs, error: e1 } = await supabase
    .from("cultos").select("*").order("data", { ascending: true });
  if (e1) { toast("Erro ao carregar cultos: " + e1.message); setStatus("offline", "erro"); return; }
  const { data: ms, error: e2 } = await supabase
    .from("momentos").select("*").order("hora", { ascending: true });
  if (e2) { toast("Erro ao carregar momentos: " + e2.message); setStatus("offline", "erro"); return; }
  const byCulto = {};
  for (const m of ms || []) {
    (byCulto[m.culto_id] = byCulto[m.culto_id] || []).push(m);
  }
  cultos = (cs || []).map((c) => ({ ...c, momentos: byCulto[c.id] || [] }));
  setStatus("online", "sincronizado");
  render();
}

// ---------- realtime ----------
function setupRealtime() {
  teardownRealtime();
  realtimeChannel = supabase.channel("cronograma")
    .on("postgres_changes", { event: "*", schema: "public", table: "cultos" }, handleCultoChange)
    .on("postgres_changes", { event: "*", schema: "public", table: "momentos" }, handleMomentoChange)
    .subscribe((status) => {
      if (status === "SUBSCRIBED") setStatus("online", "sincronizado");
      else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") setStatus("offline", "offline");
    });
}
function teardownRealtime() {
  if (realtimeChannel) { supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
}
function handleCultoChange(payload) {
  const { eventType, new: nw, old } = payload;
  if (eventType === "INSERT") {
    if (!cultos.find((c) => c.id === nw.id)) cultos.push({ ...nw, momentos: [] });
  } else if (eventType === "UPDATE") {
    const c = cultos.find((c) => c.id === nw.id);
    if (c) Object.assign(c, nw);
  } else if (eventType === "DELETE") {
    cultos = cultos.filter((c) => c.id !== old.id);
  }
  render();
}
function handleMomentoChange(payload) {
  const { eventType, new: nw, old } = payload;
  if (eventType === "INSERT") {
    const c = cultos.find((c) => c.id === nw.culto_id);
    if (c && !c.momentos.find((m) => m.id === nw.id)) c.momentos.push(nw);
  } else if (eventType === "UPDATE") {
    const c = cultos.find((c) => c.id === nw.culto_id);
    if (c) {
      const i = c.momentos.findIndex((m) => m.id === nw.id);
      if (i >= 0) c.momentos[i] = nw; else c.momentos.push(nw);
    }
  } else if (eventType === "DELETE") {
    for (const c of cultos) c.momentos = c.momentos.filter((m) => m.id !== old.id);
  }
  render();
}

function render() {

  const sorted = [...cultos].sort((a, b) => (a.data || "").localeCompare(b.data || ""));
  const filtered = sorted.filter((c) => {
    if (mesVal && !(c.data || "").startsWith(mesVal)) return false;
    if (q) {
      const hay = [
        c.tema, c.pregador, c.dirigente, c.obs,
        ...(c.momentos || []).flatMap((m) => [m.atividade, m.responsavel]),
      ].join(" ").toLowerCase();

    }
    return true;
  });

const notifState = {
  timers: [], // ids de setTimeout
  perm: typeof Notification !== "undefined" ? Notification.permission : "unsupported",
};
function updateNotifButton() {
  const b = el("notifBtn");
  if (typeof Notification === "undefined") { b.hidden = true; return; }
  if (notifState.perm === "granted") { b.hidden = true; return; }

  b.disabled = notifState.perm === "denied";

  try {
    const p = await Notification.requestPermission();
    notifState.perm = p;
    updateNotifButton();

      toast("Avisos ativados.");
      scheduleAllNotifs();
    }
  } catch (e) { toast("Não foi possível ativar."); }
});

function clearNotifs() {
  for (const t of notifState.timers) clearTimeout(t);
  notifState.timers = [];
}
function fireLocal(title, body, tag) {
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  try {
    if (navigator.serviceWorker?.controller && "showNotification" in ServiceWorkerRegistration.prototype) {
      navigator.serviceWorker.ready.then((reg) => {
        reg.showNotification(title, { body, tag, icon: "icon-192.png", badge: "icon-192.png" });
      });
    } else {
      new Notification(title, { body, tag, icon: "icon-192.png" });
    }
  } catch (e) {}
}
function scheduleAllNotifs() {
  clearNotifs();
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  const now = Date.now();
  for (const c of cultos) {
    for (const m of (c.momentos || [])) {
      const start = momentoStart(c, m);
      if (!start) continue;
      const dt = start.getTime();
      if (dt < now) continue;
      const isMine = nomeMatchesResponsavel(meuNome, m.responsavel);
      const atv = m.atividade || "Momento";
      const horaStr = hhmm(start);
      // 2 min antes
      const pre = dt - 2 * 60 * 1000;
      if (pre > now) {
        const id1 = setTimeout(() => {
          fireLocal(
            isMine ? "⚡ Você é o próximo!" : "Próximo momento em 2 min",
            `${horaStr} • ${atv}` + (m.responsavel ? ` — ${primeiroResp(m.responsavel)}` : ""),
            "pre-" + m.id
          );
        }, pre - now);
        notifState.timers.push(id1);
      }
      // No início
      const id2 = setTimeout(() => {
        fireLocal(
          isMine ? "⚡ É agora: " + atv : "Começou: " + atv,
          horaStr + (m.responsavel ? ` — ${primeiroResp(m.responsavel)}` : ""),
          "start-" + m.id
        );
      }, dt - now);
      notifState.timers.push(id2);
    }
  }
}

// ================= Live banner =================
let liveTimer = null;
function startLiveTick() {
  if (liveTimer) clearInterval(liveTimer);
  renderLive();
  liveTimer = setInterval(renderLive, 15000);
}
function momentoStart(c, m) {
  if (!c?.data || !m?.hora) return null;
  const [y, mo, d] = c.data.split("-").map(Number);
  const [hh, mm] = (m.hora || "").split(":").map(Number);
  if ([y, mo, d, hh, mm].some((v) => Number.isNaN(v))) return null;
  return new Date(y, mo - 1, d, hh, mm, 0);
}
function momentoEnd(c, m, next) {
  if (m.hora_fim) {
    const [y, mo, d] = c.data.split("-").map(Number);
    const [hh, mm] = m.hora_fim.split(":").map(Number);
    if (![y, mo, d, hh, mm].some(Number.isNaN)) return new Date(y, mo - 1, d, hh, mm, 0);
  }
  if (next) return momentoStart(c, next);
  const s = momentoStart(c, m);
  return s ? new Date(s.getTime() + 30 * 60 * 1000) : null;
}
function hhmm(d) {
  if (!d) return "";
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function nomeMatchesResponsavel(nome, resp) {
  if (!nome || !resp) return false;
  const n = nome.toLowerCase();
  return resp.toLowerCase().split(/\r?\n|,/).some((p) => p.trim().includes(n));
}
function primeiroResp(resp) {
  return (resp || "").split(/\r?\n|,/)[0].trim();
}
function pickCultoAtivo() {
  if (!cultos.length) return null;
  const now = Date.now();
  const sorted = [...cultos].sort((a, b) => (a.data || "").localeCompare(b.data || ""));
  for (const c of sorted) {
    const ms = (c.momentos || []).map((m) => momentoStart(c, m)).filter(Boolean);
    if (!ms.length) continue;
    const first = Math.min(...ms.map((d) => d.getTime()));
    const last = Math.max(...ms.map((d) => d.getTime())) + 60 * 60 * 1000;
    if (now < last) return c;
    // já passou — tenta próximo
  }
  return null;
}
function renderLive() {
  const bn = el("liveBanner");
  const c = pickCultoAtivo();
  if (!c) { bn.classList.add("hidden-live"); return; }
  const now = new Date();
  const momentos = [...(c.momentos || [])]
    .map((m) => ({ m, s: momentoStart(c, m) }))
    .filter((x) => x.s)
    .sort((a, b) => a.s - b.s);
  if (!momentos.length) { bn.classList.add("hidden-live"); return; }

  const firstStart = momentos[0].s;
  const lastStart = momentos[momentos.length - 1].s;
  const culto_fim = new Date(lastStart.getTime() + 60 * 60 * 1000);

  let state = "antes", agoraIdx = -1;
  if (now >= firstStart && now <= culto_fim) {
    for (let i = 0; i < momentos.length; i++) {
      const next = momentos[i + 1]?.s;
      const end = momentoEnd(c, momentos[i].m, momentos[i + 1]?.m);
      if (now >= momentos[i].s && (next ? now < next : now <= end)) {
        agoraIdx = i; state = "agora"; break;
      }
    }
    if (agoraIdx === -1) state = "entre";
  } else if (now > culto_fim) {
    state = "depois";
  }

  const proxIdx = agoraIdx >= 0
    ? agoraIdx + 1
    : momentos.findIndex((x) => x.s > now);
  const prox = proxIdx >= 0 && proxIdx < momentos.length ? momentos[proxIdx] : null;

  const header = `
    <div class="corner">${escapeHtml(fmtDate(c.data))}${c.tema ? " · " + escapeHtml(c.tema) : ""}</div>
  `;

  let html = header;

  if (state === "antes") {
    const diff = momentos[0].s - now;
    const totMin = Math.ceil(diff / 60000);
    const h = Math.floor(totMin / 60);
    const mm = totMin % 60;
    const tempo = h > 0 ? `${h}h ${mm}min` : `${mm}min`;
    html += `
      <div class="label">Próximo culto começa em</div>
      <div class="title">${tempo}</div>
      <div class="meta">${hhmm(momentos[0].s)} — ${escapeHtml(momentos[0].m.atividade)}</div>
    `;
  } else if (state === "depois") {
    html += `<div class="label">Culto encerrado</div><div class="title">Até o próximo! 🙌</div>`;
  } else if (state === "agora" || state === "entre") {
    if (state === "agora") {
      const m = momentos[agoraIdx].m;
      const s = momentos[agoraIdx].s;
      const end = momentoEnd(c, m, momentos[agoraIdx + 1]?.m);
      const faixa = `${hhmm(s)}${end ? " – " + hhmm(end) : ""}`;
      const mine = nomeMatchesResponsavel(meuNome, m.responsavel);
      html += `
        <div class="label">⏱️ Agora</div>
        <div class="row"><div class="title">${escapeHtml(m.atividade)}</div><div class="meta">${faixa}</div></div>
        ${m.responsavel ? `<div class="resp">${renderResp(m.responsavel)}</div>` : ""}
        ${mine ? `<div class="highlight">⚡ Você está nesse momento</div>` : ""}
      `;
    } else {
      html += `<div class="label">Intervalo</div><div class="title">Aguardando próximo momento</div>`;
    }
    if (prox) {
      const diffMin = Math.max(0, Math.round((prox.s - now) / 60000));
      const mine = nomeMatchesResponsavel(meuNome, prox.m.responsavel);
      html += `<div class="divider"></div>
        <div class="next">
          <div class="label">A seguir ${diffMin > 0 ? "em " + diffMin + " min" : ""}</div>
          <div class="row"><div class="title">${escapeHtml(prox.m.atividade)}</div><div class="meta">${hhmm(prox.s)}</div></div>
          ${prox.m.responsavel ? `<div class="resp">${renderResp(prox.m.responsavel)}</div>` : ""}
          ${mine ? `<div class="highlight">⚡ Você é o próximo</div>` : ""}
        </div>`;
    }
  }

  bn.innerHTML = html;
  bn.classList.remove("hidden-live");
}
function renderResp(resp) {
  return escapeHtml(resp).split(/\r?\n|,\s*/).filter(Boolean).map((r) => `<div>→ ${r}</div>`).join("");
}

function initDefaultDate() {
  const elD = el("data");
  const today = new Date();
  const diasAteDom = (7 - today.getDay()) % 7;
  const prox = new Date(today);
  prox.setDate(today.getDate() + (diasAteDom === 0 ? 7 : diasAteDom));
  const y = prox.getFullYear();
  const m = String(prox.getMonth() + 1).padStart(2, "0");
  const d = String(prox.getDate()).padStart(2, "0");
  elD.value = `${y}-${m}-${d}`;
}
</script>
